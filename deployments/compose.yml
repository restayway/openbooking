services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"

  postgres-pds:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: openbooking
      POSTGRES_USER: openbooking
      POSTGRES_DB: openbooking_pds
    ports:
      - "5433:5432"

  postgres-core:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: openbooking
      POSTGRES_USER: openbooking
      POSTGRES_DB: openbooking_core
    ports:
      - "5434:5432"

  openbao:
    image: openbao/openbao:2.2.0
    cap_add: ["IPC_LOCK"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports:
      - "8200:8200"
